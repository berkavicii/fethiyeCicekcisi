# /etc/nginx/sites-available/fethiyecicekcisi — sonra: ln -s ../sites-available/fethiyecicekcisi /etc/nginx/sites-enabled/
# SSL sertifikası (certbot) kurulduktan sonra certbot bu dosyayı otomatik olarak
# 443 + ssl_certificate satırlarıyla güncelleyecektir; buradaki 80 bloğu ilk kurulum içindir.

server {
    listen 80;
    listen [::]:80;
    server_name fethiyecicekcisi.com www.fethiyecicekcisi.com;

    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;

        # Uygulama bu üç başlığı ForwardedHeaders ile okuyor (Program.cs) — gerçek IP,
        # şema ve host olmadan ödeme sağlayıcısına giden user_ip 127.0.0.1 kalır.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host $host;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection keep-alive;
        proxy_cache_bypass $http_upgrade;
    }

    client_max_body_size 20M;
}
